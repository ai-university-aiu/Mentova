<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Mentova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/assets/chat/chat.css?v=4">
  <script>
    // Apply saved theme before first paint to avoid flash.
    (function () {
      var t = localStorage.getItem('mc_theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.setAttribute('data-theme', t);
      }
    }());
  </script>
</head>
<body>
  <header class="mc-header">
    <div class="mc-header-inner">
      <div class="mc-header-title">
        <h1>Chat with Mentova</h1>
        <p class="mc-notice">This is a learning machine.</p>
      </div>
      <div class="mc-theme-toggle" role="group" aria-label="Theme">
        <button class="mc-theme-btn" data-theme-val="light"  aria-label="Light mode">Light</button>
        <button class="mc-theme-btn" data-theme-val="system" aria-label="System default">System</button>
        <button class="mc-theme-btn" data-theme-val="dark"   aria-label="Dark mode">Dark</button>
      </div>
    </div>
  </header>

  <main class="mc-main">
    <div id="mc-history" class="mc-history" aria-live="polite" aria-label="Chat history">
      <!-- Messages appear here -->
    </div>

    <form id="mc-form" class="mc-input-row" autocomplete="off">
      <label for="mc-input" class="mc-sr-only">Type your message</label>
      <input
        id="mc-input"
        type="text"
        class="mc-input"
        placeholder="Type a message and press Enter or Send"
        maxlength="500"
        required
      >
      <button type="submit" class="mc-send-btn">Send</button>
    </form>
    <p class="mc-recording-notice">This conversation is recorded.</p>
  </main>

  <script src="/assets/chat/chat.js?v=3"></script>
  <script>
    MentovaChat.init({ tier: 'public' });
  </script>
</body>
</html>
